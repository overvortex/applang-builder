name: Build APK

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'File name being compiled'
        required: true
        default: 'main.al'
      code:
        description: 'AppLang source code'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Save code to file
        run: |
          echo "${{ github.event.inputs.code }}" > ${{ github.event.inputs.filename }}

      # Add your Android / Gradle build steps below this...

