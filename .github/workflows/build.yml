name: Build APK

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'File name being compiled'
        required: true
        default: 'main.al'
      code:
        description: 'AppLang source code'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Save AppLang Code
        run: |
          mkdir -p output
          echo "${{ github.event.inputs.code }}" > output/${{ github.event.inputs.filename }}

      - name: Package App as Zip Artifact
        run: |
          cd output
          zip -r ../applang-build.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: applang-build.zip

