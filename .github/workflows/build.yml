name: Build APK

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'File name being compiled'
        required: true
        default: 'main.al'
      code:
        description: 'AppLang source code'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Minimal Android Project Structure
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Initializing basic android project structure..."
            mkdir -p app/src/main/java app/src/main/res
            
            printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.applang.app'\n    compileSdk 33\n    defaultConfig {\n        applicationId \"com.applang.app\"\n        minSdk 21\n        targetSdk 33\n        versionCode 1\n        versionName \"1.0\"\n    }\n}\n" > app/build.gradle

            printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:7.4.2'\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle

            echo "include ':app'" > settings.gradle
            gradle wrapper
          fi

      - name: Save AppLang code into project source
        run: |
          echo "${{ github.event.inputs.code }}" > app/src/main/assets-${{ github.event.inputs.filename }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
            plugins {
                id 'com.android.application'
            }
            android {
                namespace 'com.applang.app'
                compileSdk 33
                defaultConfig {
                    applicationId "com.applang.app"
                    minSdk 21
                    targetSdk 33
                    versionCode 1
                    versionName "1.0"
                }
            }
            EOF

            # Create root build.gradle
            cat << 'EOF' > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:7.4.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF

            # Create settings.gradle
            echo "include ':app'" > settings.gradle
            
            # Generate gradle wrapper files
            gradle wrapper
          fi

      - name: Save AppLang code into project source
        run: |
          echo "${{ github.event.inputs.code }}" > app/src/main/assets-${{ github.event.inputs.filename }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

