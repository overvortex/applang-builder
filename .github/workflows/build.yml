name: Build APK

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'File name being compiled'
        required: true
        default: 'main.al'
      code:
        description: 'AppLang source code'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Minimal Android Project Structure
        run: |
          # If a gradle wrapper doesn't exist yet, create a basic structure so it compiles
          if [ ! -f "gradlew" ]; then
            echo "Initializing basic android project structure..."
            mkdir -p app/src/main/java app/src/main/res
            
            # Create a basic build.gradle for the app
            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
            }
            android {
                namespace 'com.applang.app'
                compileSdk 33
                defaultConfig {
                    applicationId "com.applang.app"
                    minSdk 21
                    targetSdk 33
                    versionCode 1
                    versionName "1.0"
                }
            }
            EOF

            # Create root build.gradle
            cat << 'EOF' > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:7.4.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF

            # Create settings.gradle
            echo "include ':app'" > settings.gradle
            
            # Generate gradle wrapper files
            gradle wrapper
          fi

      - name: Save AppLang code into project source
        run: |
          echo "${{ github.event.inputs.code }}" > app/src/main/assets-${{ github.event.inputs.filename }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

